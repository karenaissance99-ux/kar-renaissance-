<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K.A. RENAISSANCE | Software & Automation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            width: 100%;
            background: rgba(11, 15, 25, 0.95);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        header nav, .nav-container, .top-menu {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 12px;
            padding: 12px 15px;
            max-width: 1200px;
            margin: 0 auto;
        }

        header nav a, .nav-link {
            color: #f3f4f6;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        header nav a:hover {
            background: rgba(59, 130, 246, 0.2);
            border-color: rgba(59, 130, 246, 0.5);
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 15px;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 1rem;
            color: #9ca3af;
            max-width: 600px;
            line-height: 1.5;
        }

        footer {
            text-align: center;
            padding: 20px;
            font-size: 0.8rem;
            color: #6b7280;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body>

    <header>
        <nav class="nav-container">
            <a href="index.html">Home</a>
            <a href="app.html">Software</a>
            <a href="#philosophy">Philosophy</a>
            <a href="#license">License</a>
        </nav>
    </header>

    <main>
        <h1>K.A. RENAISSANCE</h1>
        <p>Emporio informático y desarrollo de software de alta gama para mercados internacionales.</p>
    </main>

    <footer>
        &copy; 2026 K.A. Renaissance. All rights reserved.
    </footer>

</body>
</html>

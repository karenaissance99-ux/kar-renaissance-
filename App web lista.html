<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K.A.R. Batch Engine - Symbiotic Suite v2.4.2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #050608;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        #childCircuitCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        .app-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 750px;
            background: rgba(15, 17, 24, 0.95);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.15);
            backdrop-filter: blur(10px);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            padding-bottom: 15px;
        }

        .header h1 {
            font-size: 1.6rem;
            letter-spacing: 2px;
            color: #fff;
            text-transform: uppercase;
        }

        .header span {
            color: #d4af37;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        .drop-zone {
            border: 2px dashed rgba(0, 212, 255, 0.4);
            border-radius: 8px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            background: rgba(5, 6, 8, 0.5);
            transition: all 0.3s;
            margin-bottom: 20px;
        }

        .drop-zone:hover {
            border-color: #d4af37;
            background: rgba(212, 175, 55, 0.05);
        }

        .drop-zone p {
            color: #a0a5b0;
            font-size: 0.95rem;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-group.full {
            grid-column: span 2;
        }

        .control-group label {
            font-size: 0.85rem;
            color: #d4af37;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input[type="range"], input[type="file"], input[type="text"] {
            background: rgba(5, 6, 8, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 9px;
            border-radius: 4px;
            outline: none;
            font-size: 0.9rem;
            user-select: text;
            -webkit-user-select: text;
        }

        .btn-process {
            width: 100%;
            padding: 14px;
            color: #050608;
            background: #d4af37;
            border: none;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-process:hover {
            background: #fff;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.8);
        }

        .status-area {
            margin-top: 20px;
            text-align: center;
            display: none;
        }

        .status-msg {
            color: #00e676;
            font-weight: 600;
            margin-bottom: 15px;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <canvas id="childCircuitCanvas"></canvas>

    <div class="app-container">
        <div class="header">
            <h1>K.A.R. Batch Engine</h1>
            <span>v2.4.2 | Symbiotic Autonomous Fusion Suite</span>
        </div>

        <div class="drop-zone" onclick="document.getElementById('imgInput').click()">
            <p id="dropText">📁 Click or drag MULTIPLE images to process</p>
            <input type="file" id="imgInput" accept="image/*" multiple style="display: none;" onchange="seleccionarArchivos(event)">
        </div>

        <div class="controls">
            <div class="control-group">
                <label for="quality">JPG Quality: <span id="qualityVal">90%</span></label>
                <input type="range" id="quality" min="10" max="100" value="90" oninput="document.getElementById('qualityVal').innerText = this.value + '%'">
            </div>

            <div class="control-group">
                <label for="opacityRange">Symbiotic Opacity: <span id="opacityVal">85%</span></label>
                <input type="range" id="opacityRange" min="10" max="100" value="85" oninput="document.getElementById('opacityVal').innerText = this.value + '%'">
            </div>

            <div class="control-group full">
                <label for="watermarkText">Subtitle Text (Optional):</label>
                <input type="text" id="watermarkText" placeholder="Ex: DESIGN | STYLE | DISCIPLINE" value="DESIGN | STYLE | DISCIPLINE">
            </div>

            <div class="control-group full">
                <label for="logoInput">Brand Shield / Logo (Optional):</label>
                <input type="file" id="logoInput" accept="image/png, image/jpeg, image/jpg" onchange="cargarLogo(event)">
            </div>
        </div>

        <button class="btn-process" onclick="procesarLoteSymbiotico()">⚡ Run Symbiotic Batch Fusion</button>

        <div class="status-area" id="statusArea">
            <p class="status-msg" id="statusMsg">Synchronizing frequencies...</p>
        </div>
    </div>

    <script>
        // SECURITY & ANTI-INSPECTION MODULE
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('dragstart', e => {
            if (e.target.tagName === 'IMG') e.preventDefault();
        });
        document.addEventListener('keydown', e => {
            if (
                e.key === 'F12' || 
                (e.ctrlKey && e.shiftKey && ['I','J','C'].includes(e.key.toUpperCase())) || 
                (e.ctrlKey && e.key.toUpperCase() === 'U')
            ) {
                e.preventDefault();
            }
        });

        const canvas = document.getElementById('childCircuitCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        class AmbientCircuit {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.axis = Math.random() > 0.5 ? 'H' : 'V';
                this.speed = (Math.random() > 0.5 ? 1 : -1) * (1 + Math.random() * 1.5);
                this.life = 0;
                this.maxLife = 100 + Math.random() * 150;
                this.length = 40 + Math.random() * 80;
                this.color = Math.random() > 0.4 ? 'rgba(0, 212, 255, ' : 'rgba(212, 175, 55, ';
            }

            update() {
                this.life++;
                if (this.axis === 'H') {
                    this.x += this.speed;
                } else {
                    this.y += this.speed;
                }

                if (this.life >= this.maxLife || this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
                    this.reset();
                }
            }

            draw() {
                const alpha = Math.sin((this.life / this.maxLife) * Math.PI) * 0.4;
                ctx.beginPath();
                if (this.axis === 'H') {
                    ctx.moveTo(this.x, this.y);
                    ctx.lineTo(this.x + this.length, this.y);
                } else {
                    ctx.moveTo(this.x, this.y);
                    ctx.lineTo(this.x, this.y + this.length);
                }
                ctx.strokeStyle = this.color + alpha + ')';
                ctx.lineWidth = 1.2;
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
                ctx.fillStyle = this.color + (alpha * 1.5) + ')';
                ctx.fill();
            }
        }

        const circuits = Array.from({ length: 30 }, () => new AmbientCircuit());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            circuits.forEach(c => {
                c.update();
                c.draw();
            });
            requestAnimationFrame(animate);
        }
        animate();

        let archivosSeleccionados = [];
        let logoEscudo = null;

        function seleccionarArchivos(e) {
            archivosSeleccionados = Array.from(e.target.files);
            if (archivosSeleccionados.length > 0) {
                document.getElementById('dropText').innerText = `✓ ${archivosSeleccionados.length} images queued.`;
            }
        }

        function cargarLogo(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                logoEscudo = new Image();
                logoEscudo.src = event.target.result;
            }
            reader.readAsDataURL(file);
        }

        async function procesarLoteSymbiotico() {
            if (archivosSeleccionados.length === 0) {
                alert("Please select at least one image to process.");
                return;
            }

            const statusArea = document.getElementById('statusArea');
            const statusMsg = document.getElementById('statusMsg');
            statusArea.style.display = 'block';
            statusMsg.innerText = `🔄 Tuning symbiotic frequency...`;

            const calidad = parseFloat(document.getElementById('quality').value) / 100;
            const opacidadBase = parseFloat(document.getElementById('opacityRange').value) / 100;
            const texto = document.getElementById('watermarkText').value.trim();

            let procesadas = 0;

            for (let i = 0; i < archivosSeleccionados.length; i++) {
                const file = archivosSeleccionados[i];
                statusMsg.innerText = `🔄 Fusing image (${i + 1} / ${archivosSeleccionados.length})...`;
                
                try {
                    const dataUrl = await procesarImagenSimbiotica(file, calidad, opacidadBase, texto);
                    const nombreLimpio = file.name.substring(0, file.name.lastIndexOf('.')) || file.name;
                    
                    const link = document.createElement('a');
                    link.href = dataUrl;
                    link.download = `${nombreLimpio}_KAR.jpg`;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);

                    procesadas++;
                    await new Promise(resolve => setTimeout(resolve, 300));

                } catch (err) {
                    console.error("Symbiotic fusion error: ", file.name, err);
                }
            }

            statusMsg.innerText = `✨ Fusion complete! (${procesadas} of ${archivosSeleccionados.length} assets successfully processed).`;
        }

        function procesarImagenSimbiotica(file, calidad, opacidadBase, texto) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');

                        canvas.width = img.width;
                        canvas.height = img.height;

                        ctx.drawImage(img, 0, 0);

                        const margen = Math.floor(canvas.width * 0.035);
                        let logoW = 0;
                        let logoHCalculado = 0;
                        let posXLogo = 0;
                        let posYLogo = 0;

                        if (logoEscudo) {
                            const targetWidth = canvas.width * 0.12;
                            const scaleFactor = targetWidth / logoEscudo.width;
                            logoW = logoEscudo.width * scaleFactor;
                            logoHCalculado = logoEscudo.height * scaleFactor;

                            posXLogo = canvas.width - logoW - margen;
                            posYLogo = canvas.height - logoHCalculado - margen - (texto !== "" ? 45 : 0);
                        }

                        let brilloPromedio = 128;
                        try {
                            const sampleX = Math.floor(posXLogo > 0 ? posXLogo - 20 : canvas.width - 200);
                            const sampleY = Math.floor(posYLogo > 0 ? posYLogo - 20 : canvas.height - 200);
                            const sampleW = Math.min(100, canvas.width - sampleX);
                            const sampleH = Math.min(100, canvas.height - sampleY);
                            
                            const pixelData = ctx.getImageData(sampleX, sampleY, sampleW, sampleH).data;
                            let sumaLuminancia = 0;
                            let totalPixeles = pixelData.length / 4;

                            for (let p = 0; p < pixelData.length; p += 4) {
                                const r = pixelData[p];
                                const g = pixelData[p+1];
                                const b = pixelData[p+2];
                                sumaLuminancia += (0.299 * r + 0.587 * g + 0.114 * b);
                            }
                            brilloPromedio = sumaLuminancia / totalPixeles;
                        } catch (e) {
                            console.warn("Cross-origin sampling bypassed, fallback applied.");
                        }

                        let modoFusion = "overlay";
                        let colorTextoRgba = "rgba(255, 255, 255, 0.98)";
                        let sombraColor = "rgba(0, 0, 0, 0.95)";
                        let colorPlacaFondo = "rgba(5, 6, 8, 0.78)";

                        if (brilloPromedio > 140) {
                            modoFusion = "multiply";
                            colorTextoRgba = "rgba(10, 12, 18, 0.98)";
                            sombraColor = "rgba(255, 255, 255, 0.9)";
                            colorPlacaFondo = "rgba(240, 240, 245, 0.82)";
                        } else if (brilloPromedio > 85) {
                            modoFusion = "overlay";
                            colorTextoRgba = "rgba(212, 175, 55, 0.98)";
                            colorPlacaFondo = "rgba(5, 6, 8, 0.75)";
                        } else {
                            modoFusion = "screen";
                            colorTextoRgba = "rgba(255, 255, 255, 1.0)";
                            colorPlacaFondo = "rgba(5, 6, 8, 0.82)";
                        }

                        if (texto !== "") {
                            const fontSize = Math.max(16, Math.floor(canvas.width * 0.020));
                            ctx.font = `bold ${fontSize}px 'Segoe UI', sans-serif`;
                            
                            const posXText = canvas.width - margen;
                            const posYText = logoEscudo ? (posYLogo + logoHCalculado + 14) : (canvas.height - margen - fontSize);

                            const textMetrics = ctx.measureText(texto);
                            const textWidth = textMetrics.width;
                            
                            ctx.fillStyle = colorPlacaFondo;
                            ctx.beginPath();
                            ctx.roundRect(posXText - textWidth - 16, posYText - 6, textWidth + 24, fontSize + 14, 4);
                            ctx.fill();

                            ctx.strokeStyle = "rgba(212, 175, 55, 0.4)";
                            ctx.lineWidth = 1;
                            ctx.stroke();

                            ctx.shadowColor = sombraColor;
                            ctx.shadowBlur = 10;
                            ctx.shadowOffsetX = 1;
                            ctx.shadowOffsetY = 1;

                            ctx.fillStyle = colorTextoRgba;
                            ctx.textAlign = "right";
                            ctx.textBaseline = "top";
                            ctx.fillText(texto, posXText, posYText);

                            ctx.shadowBlur = 0;
                            ctx.shadowOffsetX = 0;
                            ctx.shadowOffsetY = 0;
                        }

                        ctx.globalAlpha = opacidadBase;
                        ctx.globalCompositeOperation = modoFusion;

                        if (logoEscudo) {
                            ctx.drawImage(logoEscudo, posXLogo, posYLogo, logoW, logoHCalculado);
                        }

                        ctx.globalAlpha = 1.0;
                        ctx.globalCompositeOperation = 'source-over';

                        const finalDataUrl = canvas.toDataURL('image/jpeg', calidad);
                        resolve(finalDataUrl);
                    }
                    img.onerror = reject;
                    img.src = event.target.result;
                }
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }
    </script>
</body>
</html>
